<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR QR Test con Cubo</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    /* Video casi invisible pero funcional */
    #qr-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      z-index: -1;
    }
  </style>
</head>

<body>

<video id="qr-video" autoplay muted playsinline></video>

<a-scene embedded>
  <!-- Cubo rojo para probar el QR -->
  <a-box id="cubo" position="0 0.5 -1" material="color: red" visible="false"></a-box>

  <a-entity camera></a-entity>
</a-scene>

<script>
const video = document.getElementById('qr-video');
const cubo = document.getElementById('cubo');

// Acceder a la cámara trasera
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
  video.srcObject = stream;
  video.play();
  requestAnimationFrame(tick);
})
.catch(err => {
  console.error("No se pudo acceder a la cámara:", err);
});

function tick() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    const code = jsQR(imageData.data, canvas.width, canvas.height);
    if (code) {
      // QR detectado → mostrar cubo
      cubo.setAttribute('visible', true);
    }
  }
  requestAnimationFrame(tick);
}
</script>

</body>
</html>

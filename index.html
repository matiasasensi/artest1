<a-scene
  mindar-image="imageTargetSrc: materiales/qr/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-box position="0 0 0" rotation="0 45 0" scale="0.3 0.3 0.3" color="red"></a-box>
  </a-entity>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
</a-scene>

<button id="startButton" style="
  position: fixed; top:0; left:0; width:100%; height:100%;
  background:black; color:white; font-size:24px; z-index:9999;
">TAP TO START AR</button>

<script>
const btn = document.getElementById("startButton");
const scene = document.querySelector("a-scene");

// NO ocultamos la escena
btn.addEventListener("click", async () => {
  btn.style.display = "none"; // overlay negro desaparece
  await scene.systems["mindar-image-system"].start();
});
</script>

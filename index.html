<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>MindAR Cubo Rojo – Fix pantalla</title>

<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
a-scene {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
}
#startButton {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  font-size: 24px;
  color: white;
  background: black;
  z-index: 9999;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: materiales/qr/targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded
  style="display:none"
>
  <a-entity mindar-image-target="targetIndex: 0">
    <a-box position="0 0 0" rotation="0 45 0" scale="0.3 0.3 0.3" color="red"></a-box>
  </a-entity>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
</a-scene>

<button id="startButton">TAP TO START AR</button>

<script>
const btn = document.getElementById("startButton");
const scene = document.querySelector("a-scene");

btn.addEventListener("click", async () => {
  btn.style.display = "none";
  scene.style.display = "block";
  await scene.systems["mindar-image-system"].start();
});
</script>

</body>
</html>

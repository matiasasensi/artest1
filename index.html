<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR NFT QR Test</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;">

    <!-- NFT Marker -->
    <a-nft type="nft" url="materiales/qr/qr" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

      <!-- Cubo rojo -->
      <a-box position="0 0.5 0" rotation="0 45 0" material="color: red" scale="0.5 0.5 0.5"></a-box>

    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR con QR real</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

<!-- Video para el QR -->
<video id="qr-video" style="display:none;"></video>

<!-- Escena A-Frame -->
<a-scene embedded>
  <a-entity id="modelo" gltf-model="url(materiales/fakemogus.glb)" scale="0.5 0.5 0.5" rotation="0 180 0" visible="false"></a-entity>
  <a-entity camera></a-entity>
</a-scene>

<script>
const video = document.getElementById('qr-video');
const modelo = document.getElementById('modelo');

navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
.then(stream => {
  video.srcObject = stream;
  video.setAttribute('playsinline', true);
  video.play();
  requestAnimationFrame(tick);
});

function tick() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    const code = jsQR(imageData.data, canvas.width, canvas.height);
    if (code) {
      // QR detectado → mostrar modelo
      modelo.setAttribute('visible', true);
    }
  }
  requestAnimationFrame(tick);
}
</script>

</body>
</html>
